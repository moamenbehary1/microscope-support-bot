<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microscope PDF Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--blue:#005a8c;--bg:#f2f5f9;--card:#fff;--tx:#14202b;--mut:#6b7a89;--bd:#d9e1ea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#18222c;--tx:#e8eef4;--mut:#93a3b3;--bd:#2a3846}}
:root[data-theme="dark"]{--bg:#10171e;--card:#18222c;--tx:#e8eef4;--mut:#93a3b3;--bd:#2a3846}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:20px;color:var(--blue);margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:var(--blue);color:#fff;cursor:pointer;font-size:15px}
button.sec{background:transparent;color:var(--blue);border:1px solid var(--blue)}
button.red{background:#c62828}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.page{display:flex;gap:10px;align-items:flex-start}
.page canvas{width:110px;height:auto;border:1px solid var(--bd);border-radius:6px;flex:none;background:#fff}
.page .f{flex:1;min-width:0}
.mini{display:flex;gap:6px;margin-top:8px}
.mini button{padding:6px 10px;font-size:13px;flex:1}
.hide{display:none}
.msg{font-size:14px;margin-top:8px;color:var(--mut)}
.ok{color:#2e7d32}.err{color:#c62828}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
</style>
</head>
<body>
<h1>🔬 Microscope — محول المحاضرات لـ PDF</h1>

<!-- الخطوة 1 -->
<section id="s1" class="card">
  <b>الخطوة 1: بيانات المحاضرة</b>
  <label>اسم المادة (بيظهر فوق على اليمين)</label>
  <input id="subject" placeholder="مثال: ميكرو">
  <label>رقم المحاضرة / السكشن (بيظهر فوق على الشمال)</label>
  <input id="label" value="Lec1" placeholder="مثال: Lec2 أو Sec3">
  <div style="margin-top:12px"><button id="next1" style="width:100%">التالي ←</button></div>
</section>

<!-- الخطوة 2 -->
<section id="s2" class="hide">
  <div class="card">
    <b>الخطوة 2: ارفعي الصور</b>
    <div class="row" style="margin-top:6px">
      <div><label>المادة</label><input id="subject2"></div>
      <div><label>المحاضرة</label><input id="label2"></div>
    </div>
    <label>طريقة وضع الصورة جوه الفريم</label>
    <select id="fit"><option value="cover">تملأ الفريم (قص بسيط من الأطراف)</option><option value="contain">كاملة بدون قص</option></select>
    <div style="margin-top:10px"><input id="files" type="file" accept="image/*" multiple></div>
  </div>
  <div id="list"></div>
  <div class="card hide" id="exportBox">
    <b>الخطوة 3: التصدير</b>
    <label>اسم الملف</label>
    <input id="fname">
    <label>الجودة</label>
    <select id="quality"><option value="normal">عادي (جودة عالية)</option><option value="small">مضغوط (حجم أصغر)</option></select>
    <div style="margin-top:12px"><button id="go" style="width:100%">⬇️ اعمل PDF وحمّل</button></div>
    <div class="bar hide" id="bar"><i id="barI"></i></div>
    <div class="msg" id="status"></div>
  </div>
</section>

<!-- الخطوة 3 -->
<section id="s3" class="card hide" style="text-align:center">
  <div style="font-size:42px">✅</div>
  <b id="doneName"></b>
  <div class="msg" id="doneInfo"></div>
  <div class="row" style="margin-top:14px">
    <button class="sec" id="again">⬇️ تحميل تاني</button>
    <button id="restart">🔄 ابدأ من الأول</button>
  </div>
</section>

const FRAME_COLOR = "#005a8c"; // لون الفريم والبادجات
const WM_OPACITY  = 0.07;      // شفافية اللوجو اللي في النص (أقل = أشف)
/* ============================================================== */

const DW = 1018, DH = 1439;                    // أبعاد تصميم الصفحة (نسبة A4)
const PHOTO = {x:14, y:31, w:982, h:1320};    // مكان الصورة جوه الفريم

let pages = [];  // {img,url,label:null|str,num:null|str}
let logoImg = null, lastBlob = null, lastName = "";
const $ = id => document.getElementById(id);

if (LOGO_SRC){ const i = new Image(); i.onload = () => { logoImg = i; redrawAll(); }; i.src = LOGO_SRC; }

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function drawLogo(c,cx,cy,r,color){
  if (logoImg){ c.drawImage(logoImg,cx-r,cy-r,r*2,r*2); return; }
  c.save(); c.strokeStyle=color; c.fillStyle=color; c.lineWidth=r*0.12;
  c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.stroke();
  [-0.42,-0.14,0.14,0.42].forEach(k=>{ c.fillRect(cx+k*r-r*0.05,cy-r*0.55,r*0.1,r*1.1); });
  c.restore();
}

function fitText(c,txt,maxW,size,weight,style){
  let s=size; c.font=`${style||""} ${weight} ${s}px Cairo,Tahoma,Arial,sans-serif`;
  while(c.measureText(txt).width>maxW && s>10){ s-=2; c.font=`${style||""} ${weight} ${s}px Cairo,Tahoma,Arial,sans-serif`; }
}

function drawPage(canvas, k, o){
  canvas.width = Math.round(DW*k); canvas.height = Math.round(DH*k);
  const c = canvas.getContext("2d");
  c.setTransform(k,0,0,k,0,0);
  c.fillStyle="#fff"; c.fillRect(0,0,DW,DH);

  // الصورة
  c.save(); c.beginPath(); c.rect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h); c.clip();
  c.fillStyle="#fff"; c.fillRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);
  if (o.img){
    const iw=o.img.naturalWidth||o.img.width, ih=o.img.naturalHeight||o.img.height;
    const sc = o.fit==="contain" ? Math.min(PHOTO.w/iw,PHOTO.h/ih) : Math.max(PHOTO.w/iw,PHOTO.h/ih);
    const w=iw*sc,h=ih*sc;
    c.drawImage(o.img,PHOTO.x+(PHOTO.w-w)/2,PHOTO.y+(PHOTO.h-h)/2,w,h);
  }
  c.restore();

  // اللوجو الشفاف في النص
  c.save(); c.globalAlpha=WM_OPACITY;
  drawLogo(c,PHOTO.x+PHOTO.w/2,PHOTO.y+PHOTO.h/2,360,FRAME_COLOR);
  c.restore();

  // إطار الصورة
  c.strokeStyle=FRAME_COLOR; c.lineWidth=8;
  c.strokeRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);

  c.textAlign="center"; c.textBaseline="middle"; c.fillStyle="#fff";

  // بادج المحاضرة (شمال فوق)
  c.fillStyle=FRAME_COLOR; rr(c,28,4,119,58,29); c.fill();
  c.fillStyle="#fff"; fitText(c,o.label,100,30,"800","italic");
  c.fillText(o.label,87.5,34);

  // بادج المادة (يمين فوق)
  c.fillStyle=FRAME_COLOR; rr(c,712,0,242,66,16); c.fill();
  c.fillStyle="#fff"; c.direction="rtl"; fitText(c,o.subject,215,34,"800","");
  c.fillText(o.subject,833,36); c.direction="ltr";

  // بادج اللوجو (شمال تحت)
  c.fillStyle=FRAME_COLOR; rr(c,24,1310,224,70,10); c.fill();
  drawLogo(c,60,1345,30,"#fff");
  c.textAlign="left"; c.fillStyle="#fff"; c.font="italic 800 22px Cairo,Arial,sans-serif"; c.fillText("MICROSCOPE",100,1334);
  c.fillStyle="#ff2a3a"; c.font="italic 800 19px Cairo,Arial,sans-serif"; c.fillText("SUPPORT",100,1358);

  // دايرة رقم الصفحة (يمين تحت)
  c.textAlign="center"; c.fillStyle=FRAME_COLOR; c.beginPath(); c.arc(915,1348,39,0,Math.PI*2); c.fill();
  c.fillStyle="#fff"; fitText(c,String(o.num),56,32,"800",""); c.fillText(String(o.num),915,1350);
}

function opts(i){
  const p=pages[i];
  return {img:p.img, fit:$("fit").value, subject:$("subject2").value||" ", label:p.label!==null?p.label:$("label2").value, num:p.num!==null?p.num:i+1};
}

function render(){
  const list=$("list"); list.innerHTML="";
  pages.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="card page";
    const cv=document.createElement("canvas"); d.appendChild(cv);
    const f=document.createElement("div"); f.className="f";
    f.innerHTML=`<div class="row"><div><label>رقم المحاضرة</label><input class="lb" value=""></div><div><label>رقم الصفحة</label><input class="nm" value=""></div></div>
      <div class="mini"><button class="sec up">↑</button><button class="sec dn">↓</button><button class="red del">حذف</button></div>`;
    d.appendChild(f); list.appendChild(d);
    const lb=f.querySelector(".lb"), nm=f.querySelector(".nm");
    lb.value=p.label!==null?p.label:$("label2").value; nm.value=p.num!==null?p.num:i+1;
    lb.oninput=()=>{p.label=lb.value; drawPage(cv,0.3,opts(i));};
    nm.oninput=()=>{p.num=nm.value; drawPage(cv,0.3,opts(i));};
    f.querySelector(".up").onclick=()=>{ if(i>0){[pages[i-1],pages[i]]=[pages[i],pages[i-1]];render();} };
    f.querySelector(".dn").onclick=()=>{ if(i<pages.length-1){[pages[i+1],pages[i]]=[pages[i],pages[i+1]];render();} };
    f.querySelector(".del").onclick=()=>{ URL.revokeObjectURL(p.url); pages.splice(i,1); render(); };
    p.cv=cv; drawPage(cv,0.3,opts(i));
  });
  $("exportBox").classList.toggle("hide",pages.length===0);
}

let t=null;
function redrawAll(){ clearTimeout(t); t=setTimeout(()=>{
  pages.forEach((p,i)=>{
    const lb=p.cv&&p.cv.parentNode.querySelector(".lb");
    if(lb && p.label===null) lb.value=$("label2").value;
    if(p.cv) drawPage(p.cv,0.3,opts(i));
  });
},150); }

$("next1").onclick=async()=>{
  if(!$("subject").value.trim()){ $("subject").focus(); return; }
  $("subject2").value=$("subject").value.trim(); $("label2").value=$("label").value.trim()||"Lec1";
  $("fname").value=`${$("subject2").value} - ${$("label2").value}`;
  try{ await document.fonts.load("800 30px Cairo"); }catch(e){}
  $("s1").classList.add("hide"); $("s2").classList.remove("hide");
};
["subject2","label2","fit"].forEach(id=>$(id).addEventListener("input",redrawAll));
$("fit").addEventListener("change",redrawAll);

$("files").onchange=e=>{
  const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  let left=fs.length; if(!left) return;
  fs.forEach(file=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ pages.push({img,url,label:null,num:null}); if(--left===0){ render(); } };
    img.onerror=()=>{ if(--left===0) render(); };
    img.src=url;
  });
  e.target.value="";
};

const tick=()=>new Promise(r=>setTimeout(r,10));

async function save(blob,name){
  const dl=await claude.use("downloads");
  if(!dl) throw {code:"unavailable"};
  return dl.save({filename:name+".pdf",data:blob});
}

$("go").onclick=async()=>{
  if(!pages.length) return;
  if(!window.jspdf){ $("status").textContent="مكتبة PDF لسه محملتش، تأكدي من النت وحاولي تاني"; $("status").className="msg err"; return; }
  $("go").disabled=true; $("bar").classList.remove("hide"); $("status").className="msg"; $("status").textContent="جاري التجهيز...";
  const small=$("quality").value==="small";
  const k=small?0.9:1.5, q=small?0.6:0.92;
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  const cv=document.createElement("canvas");
  for(let i=0;i<pages.length;i++){
    drawPage(cv,k,opts(i));
    if(i>0) doc.addPage();
    doc.addImage(cv.toDataURL("image/jpeg",q),"JPEG",0,0,210,297,undefined,"FAST");
    $("barI").style.width=Math.round((i+1)/pages.length*100)+"%";
    $("status").textContent=`صفحة ${i+1} من ${pages.length}`;
    await tick();
  }
  const name=($("fname").value.trim()||"lecture").replace(/[\\/:*?"<>|]/g,"-");
  const blob=doc.output("blob"); lastBlob=blob; lastName=name;
  let saveMsg="";
  try{ await save(blob,name); saveMsg="اتحفظ ✅"; }catch(e){ saveMsg=(e&&e.code==="declined")?"لم يتم الحفظ، دوسي تحميل تاني":"التحميل مش متاح هنا"; }
  $("doneName").textContent=name+".pdf";
  $("doneInfo").textContent=`${pages.length} صفحة — ${(blob.size/1048576).toFixed(1)} MB`;
  $("doneInfo").textContent+=" — "+saveMsg;
  $("s2").classList.add("hide"); $("s3").classList.remove("hide");
  $("go").disabled=false; $("bar").classList.add("hide"); $("barI").style.width="0";
};

$("again").onclick=()=>{ if(lastBlob) save(lastBlob,lastName).catch(()=>{}); };
$("restart").onclick=()=>{
  pages.forEach(p=>URL.revokeObjectURL(p.url)); pages=[]; lastBlob=null;
  $("list").innerHTML=""; $("exportBox").classList.add("hide");
  $("subject").value=""; $("label").value="Lec1"; $("status").textContent="";
  $("s3").classList.add("hide"); $("s2").classList.add("hide"); $("s1").classList.remove("hide");
};
</script>
