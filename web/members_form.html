<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICROSCOPE TEAM — تسجيل بيانات الأعضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#000000;
  --bg:#070a14;
  --surface:rgba(15,23,42,0.65);
  --primary:#3b82f6;
  --accent:#0ea5e9;
  --border-blue:rgba(59,130,246,0.3);
  --text:#ffffff;
  --dim:#94a3b8;
  --muted:#475569;
  --r:20px;
  --font-ar:'Cairo',sans-serif;
  --font-en:'Outfit',sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ar);
  background:var(--bg-deep);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding: 60px 20px;
  overflow-x:hidden;
}
.bg-canvas{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);}
.bg-orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:0.25;animation:floatOrb 18s ease-in-out infinite}
.orb1{width:700px;height:700px;background:#3b82f6;top:-250px;right:-200px}
.orb2{width:600px;height:600px;background:#0ea5e9;bottom:-200px;left:-150px;animation-delay:-9s;opacity:0.2}
@keyframes floatOrb{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(50px,-60px) scale(1.1)}
  66%{transform:translate(-40px,50px) scale(0.9)}
}
.grid-lines{
  position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
}

.header-container {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 50px;
  animation: fadeInDown 1s ease-out;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.brand-title {
  font-family: var(--font-en);
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
  filter: drop-shadow(0 0 30px rgba(59,130,246,0.5));
}
.subtitle {
  color: var(--dim);
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.form-card {
  position: relative;
  z-index: 2;
  background: var(--surface);
  border: 1px solid var(--border-blue);
  border-radius: var(--r);
  padding: 50px;
  width: 100%;
  max-width: 850px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  animation: fadeInUp 1s ease-out 0.2s both;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}
.form-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#3b82f6,#0ea5e9,transparent);
  border-radius: var(--r) var(--r) 0 0;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.form-group.full-width {
  grid-column: 1 / -1;
}
label {
  font-weight: 600;
  color: #e2e8f0;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
label .req {
  color: #f43f5e;
  font-weight: bold;
}
input, select {
  background: rgba(15,23,42,0.8);
  border: 1px solid rgba(148,163,184,0.2);
  border-radius: 14px;
  padding: 16px 20px;
  color: var(--text);
  font-family: var(--font-ar);
  font-size: 1.05rem;
  outline: none;
  transition: all 0.3s ease;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
}
input[type="date"] {
  font-family: var(--font-en);
}
input:focus, select:focus {
  border-color: var(--accent);
  background: rgba(15,23,42,0.95);
  box-shadow: 0 0 0 4px rgba(14,165,233,0.15), inset 0 2px 4px rgba(0,0,0,0.2);
  transform: translateY(-2px);
}
select option {
  background: #0f172a;
  color: #ffffff;
}
input::placeholder {
  color: var(--muted);
}
input[type="file"] {
  padding: 12px;
  cursor: pointer;
}
input[type="file"]::file-selector-button {
  background: rgba(59,130,246,0.2);
  border: 1px solid rgba(59,130,246,0.5);
  color: #fff;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-ar);
  margin-left: 15px;
}
input[type="file"]::file-selector-button:hover {
  background: rgba(59,130,246,0.4);
}

.btn-submit {
  grid-column: 1 / -1;
  margin-top: 30px;
  padding: 18px 32px;
  border-radius: 16px;
  background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
  color: #fff;
  border: none;
  font-family: var(--font-ar);
  font-size: 1.25rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 10px 25px rgba(37,99,235,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  position: relative;
  overflow: hidden;
}
.btn-submit::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: all 0.5s;
}
.btn-submit:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 15px 35px rgba(14,165,233,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-submit:hover::after {
  left: 200%;
}

@media(max-width: 768px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  .form-card {
    padding: 30px 20px;
  }
  .brand-title {
    font-size: 2.2rem;
  }
}

/* Toast */
.toast-bar{
  position:fixed;bottom:30px;right:30px;
  background:rgba(15,23,42,0.95);
  border:1px solid rgba(14,165,233,0.4);
  backdrop-filter:blur(16px);
  border-radius:16px;
  padding:16px 24px;
  color:#f8fafc;
  font-weight:700;
  font-size:1.05rem;
  z-index:9999;
  display:flex;align-items:center;gap:12px;
  transform:translateY(100px);opacity:0;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}
.toast-bar.show{transform:translateY(0);opacity:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
</div>
<div class="grid-lines"></div>

<div class="header-container">
  <h1 class="brand-title">MICROSCOPE TEAM</h1>
  <p class="subtitle">استمارة تسجيل بيانات أعضاء الفريق</p>
</div>

<form class="form-card form-grid" id="memberForm">
  
  <div class="form-group full-width">
    <label for="picture">صورة شخصية (ارفع صورتك) <span class="req">*</span></label>
    <input type="file" id="picture" accept="image/*" required>
  </div>

  <div class="form-group full-width">
    <label for="fullName">الاسم الرباعي <span class="req">*</span></label>
    <input type="text" id="fullName" placeholder="الاسم الرباعي باللغة العربية" required minlength="10">
  </div>

  <div class="form-group">
    <label for="nationalId">الرقم القومي <span class="req">*</span></label>
    <input type="text" id="nationalId" placeholder="14 رقم" pattern="[0-9]{14}" required>
  </div>
  
  <div class="form-group">
    <label for="birthDate">تاريخ الميلاد <span class="req">*</span></label>
    <input type="date" id="birthDate" required>
  </div>

  <div class="form-group">
    <label for="committee">اللجنة (Committee) <span class="req">*</span></label>
    <select id="committee" required>
      <option value="" disabled selected>اختر لجنتك...</option>
      <option value="HR">HR</option>
      <option value="PR">PR</option>
      <option value="PM">PM</option>
      <option value="Scientific">Scientific</option>
      <option value="Social Media">Social Media</option>
      <option value="Charity">خيرية (Charity)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="role">المنصب في اللجنة <span class="req">*</span></label>
    <select id="role" required onchange="toggleHeadCode()">
      <option value="Member" selected>عضو (Member)</option>
      <option value="Head">رئيس لجنة (Head)</option>
    </select>
  </div>

  <div class="form-group" id="headCodeGroup" style="display: none;">
    <label for="headCode">كود التحقق (للمشرفين فقط) <span class="req">*</span></label>
    <input type="password" id="headCode" placeholder="أدخل الكود">
  </div>
  
  <script>
    function toggleHeadCode() {
      const role = document.getElementById('role').value;
      const codeGroup = document.getElementById('headCodeGroup');
      const codeInput = document.getElementById('headCode');
      if (role === 'Head') {
        codeGroup.style.display = 'flex';
        codeInput.required = true;
      } else {
        codeGroup.style.display = 'none';
        codeInput.required = false;
        codeInput.value = '';
      }
    }
  </script>

  <div class="form-group">
    <label for="collegeYear">الفرقة الدراسية <span class="req">*</span></label>
    <select id="collegeYear" required>
      <option value="" disabled selected>اختر الفرقة...</option>
      <option value="الفرقة الأولى">الفرقة الأولى</option>
      <option value="الفرقة الثانية">الفرقة الثانية</option>
      <option value="الفرقة الثالثة">الفرقة الثالثة</option>
      <option value="الفرقة الرابعة">الفرقة الرابعة</option>
      <option value="خريج">خريج</option>
    </select>
  </div>

  <div class="form-group">
    <label for="whatsapp">رقم الواتساب <span class="req">*</span></label>
    <input type="tel" id="whatsapp" placeholder="01xxxxxxxxx" required>
  </div>

  <div class="form-group">
    <label for="phone">رقم آخر إن وجد</label>
    <input type="tel" id="phone" placeholder="01xxxxxxxxx">
  </div>

  <div class="form-group full-width">
    <label for="address">العنوان بالتفصيل <span class="req">*</span></label>
    <input type="text" id="address" placeholder="المحافظة - المركز - الشارع" required>
  </div>

  <div class="form-group">
    <label for="email">البريد الإلكتروني <span class="req">*</span></label>
    <input type="email" id="email" placeholder="example@gmail.com" required>
  </div>

  <div class="form-group">
    <label for="facebook">لينك صفحة الفيسبوك <span class="req">*</span></label>
    <input type="url" id="facebook" placeholder="https://facebook.com/..." required>
  </div>

  <button type="submit" class="btn-submit">حفظ البيانات وإرسالها 🚀</button>

</form>

<div id="successMessage" class="form-card" style="display: none; text-align: center; padding: 60px 20px;">
  <div style="font-size: 5rem; margin-bottom: 25px; animation: bounceIn 1s;">✨</div>
  <h2 style="color: #10b981; font-size: 2.2rem; margin-bottom: 15px; font-weight: 800;">تم حفظ البيانات بنجاح!</h2>
  <p style="color: var(--dim); font-size: 1.2rem; line-height: 1.6;">شكراً لك، لقد تم تسجيل بياناتك بنجاح.<br>لا يمكنك التسجيل مرة أخرى من هذا الجهاز.</p>
</div>

<div class="toast-bar" id="toast">✅ جاري حفظ البيانات...</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('microscope_submitted') === 'true') {
    document.getElementById('memberForm').style.display = 'none';
    document.getElementById('successMessage').style.display = 'block';
  }
});

document.getElementById('memberForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const fileInput = document.getElementById('picture');
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
    alert('يرجى اختيار صورة');
    return false;
  }
  const file = fileInput.files[0];
  
  const submitBtn = document.querySelector('.btn-submit');
  submitBtn.disabled = true;
  submitBtn.innerHTML = 'جاري الإرسال... ⏳';
  submitBtn.style.opacity = '0.7';

  const reader = new FileReader();
  reader.onload = async function(event) {
    const base64String = event.target.result;
    
    let roleVal = document.getElementById('role').value;
    const headCode = document.getElementById('headCode').value;
    if (roleVal === 'Head' && headCode !== '1111') {
      roleVal = 'Member';
    }

    const memberData = {
      id: Date.now().toString(),
      picture: base64String,
      fullName: document.getElementById('fullName').value,
      nationalId: document.getElementById('nationalId').value,
      birthDate: document.getElementById('birthDate').value,
      committee: document.getElementById('committee').value,
      role: roleVal,
      phone: document.getElementById('phone').value,
      whatsapp: document.getElementById('whatsapp').value,
      address: document.getElementById('address').value,
      collegeYear: document.getElementById('collegeYear').value,
      email: document.getElementById('email').value,
      facebook: document.getElementById('facebook').value,
      timestamp: new Date().toLocaleString('en-US', { timeZone: 'Africa/Cairo' })
    };

    // Create a temporary element for the PDF
    const pdfDiv = document.createElement('div');
    pdfDiv.style.padding = '40px';
    pdfDiv.style.fontFamily = 'Cairo, sans-serif';
    pdfDiv.style.direction = 'rtl';
    pdfDiv.style.background = '#ffffff';
    pdfDiv.style.color = '#000000';
    pdfDiv.style.position = 'absolute';
    // FIX for empty PDF: Ensure element is offscreen but rendered horizontally, not vertically hidden
    pdfDiv.style.left = '-9999px';
    pdfDiv.style.top = '0';
    pdfDiv.style.width = '800px';
    
    pdfDiv.innerHTML = `
      <div style="text-align:center; margin-bottom: 20px;">
        <img src="${base64String}" style="width:150px; height:150px; border-radius:50%; object-fit:cover; border:3px solid #3b82f6;">
        <h1 style="color:#0f172a; margin:10px 0 5px 0;">${memberData.fullName}</h1>
        <h3 style="color:#3b82f6; margin:0;">${(memberData.role === 'Head' ? 'Head ' : '') + memberData.committee + ' Commit'}</h3>
      </div>
      <table style="width:100%; border-collapse:collapse; margin-top:20px; font-size:18px;" border="1" cellpadding="10">
        <tr><th style="background:#f8fafc; width:35%;">الرقم القومي</th><td>${memberData.nationalId}</td></tr>
        <tr><th style="background:#f8fafc;">تاريخ الميلاد</th><td>${memberData.birthDate}</td></tr>
        <tr><th style="background:#f8fafc;">الفرقة الدراسية</th><td>${memberData.collegeYear}</td></tr>
        <tr><th style="background:#f8fafc;">الهاتف / واتساب</th><td>${memberData.phone || '-'} / ${memberData.whatsapp}</td></tr>
        <tr><th style="background:#f8fafc;">البريد الإلكتروني</th><td>${memberData.email}</td></tr>
        <tr><th style="background:#f8fafc;">العنوان</th><td>${memberData.address}</td></tr>
        <tr><th style="background:#f8fafc;">فيسبوك</th><td><a style="color: #3b82f6;" href="${memberData.facebook}">${memberData.facebook}</a></td></tr>
      </table>
    `;

    document.body.appendChild(pdfDiv);

    try {
      const opt = {
        margin:       0.5,
        filename:     `Member_${memberData.fullName}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, logging: false },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' },
      };

      const pdfBase64 = await html2pdf().set(opt).from(pdfDiv).outputPdf('datauristring');
      
      // Upload to Backup Channel
      await fetch('/api/backup_member', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          file_name: `Member_${memberData.fullName.replace(/\s+/g, '_')}.pdf`,
          file_base64: pdfBase64
        })
      });
    } catch(err) {
      console.error('PDF Error:', err);
    } finally {
      document.body.removeChild(pdfDiv);
    }

    let existingMembers = [];
    try {
      const rawData = localStorage.getItem('microscope_members_data');
      if (rawData) {
        existingMembers = JSON.parse(rawData);
      }
    } catch(e) {
      console.error("Error reading from localStorage", e);
    }

    existingMembers.push(memberData);
    localStorage.setItem('microscope_members_data', JSON.stringify(existingMembers));
    localStorage.setItem('microscope_submitted', 'true');

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    
    setTimeout(() => {
      toast.classList.remove('show');
      document.getElementById('memberForm').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
    }, 1500);

    return false;
  };
  
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
